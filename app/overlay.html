<!doctype html>
<html lang="en" class="theme-dark">
  <head>
    <meta charset="UTF-8" />
    <title>Purl Voice</title>
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/brand/components/components.css" />
    <link rel="stylesheet" href="/src/brand/components/pill.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        background-color: rgba(0, 0, 0, 0);
        overflow: hidden;
        height: 100%;
        user-select: none;
        -webkit-user-select: none;
        font-family: var(--font-ui);
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding-bottom: 24px;
        box-sizing: border-box;
      }

      /* ---------- the control: ✕ · dictation pill · ✓ ---------- */
      /* The window is 420x100 and sits bottom-centre over other apps. The
         widest state (recording: ✕, listening pill with 32 bars and a timer,
         ✓) is ~400 px; captions ellipsize inside the pill's reserve. #pill is
         the whole clickable control, and its box is what Rust gets as the
         hit rect. */
      #pill {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      body[data-app="idle"] #pill {
        cursor: pointer;
      }

      /* The brand pill hugs its morphing capsule here instead of reserving
         its widest box, so the buttons sit right beside it. The float
         shadow is tightened to fit inside the small transparent window. */
      #capsule.purl-pill {
        --pill-reserve: 340px;
        --shadow-float: 0 8px 22px rgb(0 0 0 / 0.45), 0 1px 3px rgb(0 0 0 / 0.4);
        width: auto;
        max-width: var(--pill-reserve);
      }

      #pill button {
        display: none;
        width: 30px;
        height: 30px;
        flex: none;
        border-radius: 50%;
        border: 1px solid var(--line-strong);
        padding: 0;
        align-items: center;
        justify-content: center;
        background: var(--surface);
        color: var(--text);
        box-shadow: var(--shadow-sm);
        cursor: pointer;
      }
      body[data-view="recording"] #pill button {
        display: flex;
      }
      #cancel:hover {
        border-color: var(--warn);
      }
      #confirm {
        border-color: transparent;
        background: var(--signal);
        color: var(--night);
      }
      #confirm:hover {
        filter: brightness(1.08);
      }
      #pill button:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      /* ---------- countdown under a transform / correction caption ---------- */
      #countdown {
        display: none;
        position: absolute;
        left: 28px;
        right: 28px;
        bottom: 5px;
        height: 2px;
        border-radius: 1px;
        background: var(--line);
        overflow: hidden;
        pointer-events: none;
      }
      body[data-view="celebrate"] #countdown {
        display: block;
      }
      #countdown-fill {
        width: 100%;
        height: 100%;
        background: var(--signal);
        transform-origin: left;
      }

      /* ---------- watch indicator: dot while a correction window is open ---------- */
      /* A badge on the capsule's top-right edge. pointer-events is off, so
         it never changes what the pill can click. The Night ring holds an
         edge over any app behind the overlay. */
      #capsule-wrap {
        position: relative;
        display: flex;
      }
      #watching {
        position: absolute;
        top: -2px;
        right: 6px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--warn);
        border: 2px solid var(--night);
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--dur-base) var(--ease-out);
      }
      body.watching #watching {
        opacity: 1;
      }

      @media (prefers-reduced-motion: reduce) {
        #watching {
          transition: none;
        }
      }
    </style>
    <script type="module" src="/src/overlay.ts" defer></script>
  </head>
  <body data-view="idle" data-app="idle">
    <div id="pill" title="Press your dictation hotkey to talk">
      <button id="cancel" type="button" aria-label="Cancel dictation" title="Cancel">
        <svg width="11" height="11" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M2 2 L12 12 M12 2 L2 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
      <div id="capsule-wrap">
        <div id="capsule"></div>
        <span id="watching" title="Watching for corrections"></span>
        <span id="countdown"><span id="countdown-fill"></span></span>
      </div>
      <button id="confirm" type="button" aria-label="Finish and transcribe" title="Finish &amp; transcribe">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M2.5 8.5 L6.5 12.5 L13.5 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>
  </body>
</html>
