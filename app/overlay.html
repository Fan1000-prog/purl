<!doctype html>
<html lang="en" class="theme-light">
  <head>
    <meta charset="UTF-8" />
    <title>Purl Voice</title>
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        background-color: rgba(0, 0, 0, 0);
        overflow: hidden;
        height: 100%;
        user-select: none;
        -webkit-user-select: none;
        font-family: var(--font-ui);
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding-bottom: 10px;
        box-sizing: border-box;
      }

      /* ---------- the pill: mascot + state label on Paper ---------- */
      /* The window is 200x82 and sits bottom-centre over other apps. The
         widest state (recording: ✕, mascot, "Listening", ✓) is ~180 px. */
      #pill {
        position: relative;
        display: flex;
        align-items: center;
        gap: 6px;
        max-width: 192px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--paper);
        box-shadow: var(--shadow);
        color: var(--ink);
      }
      /* Room after the label; recording ends on the ✓ button instead. */
      body:not([data-view="idle"]):not([data-view="recording"]) #pill {
        padding-right: 14px;
      }
      body[data-app="idle"] #pill {
        cursor: pointer;
      }

      #mascot-slot {
        display: flex;
        border-radius: 50%;
        /* Mic level: a Sprout ring that swells with the speaker's voice. */
        box-shadow: 0 0 0 calc(var(--level, 0) * 5px) rgba(183, 205, 163, 0.75);
      }

      #label {
        min-width: 0;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      body[data-view="idle"] #label {
        display: none;
      }
      body[data-view="error"] #label {
        color: var(--warn-text);
      }

      #pill button {
        display: none;
        width: 28px;
        height: 28px;
        flex: none;
        border-radius: 50%;
        border: none;
        padding: 0;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      body[data-view="recording"] #pill button {
        display: flex;
      }
      #cancel {
        background: var(--cream);
        color: var(--ink);
      }
      #cancel:hover {
        background: var(--peach);
      }
      #confirm {
        background: var(--fern);
        color: var(--paper);
      }
      #confirm:hover {
        filter: brightness(1.1);
      }

      /* ---------- countdown under a transform / correction caption ---------- */
      #countdown {
        display: none;
        position: absolute;
        left: 22px;
        right: 22px;
        bottom: 3px;
        height: 2px;
        border-radius: 1px;
        background: var(--line);
        overflow: hidden;
      }
      body[data-view="celebrate"] #countdown {
        display: block;
      }
      #countdown-fill {
        width: 100%;
        height: 100%;
        background: var(--fern);
        transform-origin: left;
      }

      /* ---------- watch indicator: dot while a correction window is open ---------- */
      /* A badge on the pill's top-right edge. pointer-events is off, so it
         never changes what the pill can click. The Ink ring plus Paper halo
         holds an edge over any app behind the overlay. */
      #watching {
        position: absolute;
        top: -3px;
        right: -3px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--terracotta);
        border: 2px solid var(--ink);
        box-shadow: 0 0 0 1px var(--paper);
        opacity: 0;
        pointer-events: none;
        transition: opacity 200ms ease;
      }
      body.watching #watching {
        opacity: 1;
      }

      #confetti-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .confetti-burst {
        position: absolute;
        bottom: 12px;
        left: 50%;
        width: 0;
        height: 0;
      }
      .confetti-piece {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 5px;
        height: 8px;
        border-radius: 2px;
        opacity: 0;
        animation: confetti-fall var(--duration) var(--delay) cubic-bezier(0.15, 0.6, 0.4, 1) forwards;
      }
      @keyframes confetti-fall {
        0% {
          opacity: 1;
          transform: translate(0, 6px) rotate(0deg);
        }
        100% {
          opacity: 0;
          transform: translate(var(--x), calc(-1 * var(--fall))) rotate(var(--rot));
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #watching {
          transition: none;
        }
      }
    </style>
    <script type="module" src="/src/overlay.ts" defer></script>
  </head>
  <body data-view="idle" data-app="idle">
    <div id="confetti-layer"></div>
    <div id="pill" title="Press your dictation hotkey to talk">
      <button id="cancel" type="button" aria-label="Cancel dictation" title="Cancel">
        <svg width="11" height="11" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M2 2 L12 12 M12 2 L2 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
      <span id="mascot-slot"></span>
      <span id="label" role="status" aria-live="polite"></span>
      <button id="confirm" type="button" aria-label="Finish and transcribe" title="Finish &amp; transcribe">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M2.5 8.5 L6.5 12.5 L13.5 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <span id="watching" title="Watching for corrections"></span>
      <span id="countdown"><span id="countdown-fill"></span></span>
    </div>
  </body>
</html>
