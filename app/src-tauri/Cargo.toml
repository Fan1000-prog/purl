[package]
name = "purl"
version = "0.9.0"
description = "Free, private, on-device dictation"
authors = ["Fani Bango"]
license = "MIT"
edition = "2021"

[lib]
name = "purl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
arboard = "3"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
thiserror = "2"
chrono = "0.4"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
sha2 = "0.10"
fs4 = "0.13"
getrandom = "0.3"
transcribe-rs = { version = "0.3", features = ["onnx"] }
ort = { version = "=2.0.0-rc.13", default-features = false }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
