<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Purl — thinking"><title>Purl mascot — thinking</title><style>
.a{transform-box:fill-box;}
.body{transform-origin:30% 100%;}
.eye{transform-origin:50% 50%;}
.shadow{transform-origin:50% 50%;}
.mouth{transform-origin:50% 50%;}

.body{animation:wiggle 1.2s ease-in-out infinite;}
@keyframes wiggle{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}
.eyes{animation:look 2.4s ease-in-out infinite;}
@keyframes look{0%,100%{transform:translate(6px,-5px)}45%,55%{transform:translate(-6px,-5px)}}
.mouth{animation:hmm 2.4s ease-in-out infinite;}
@keyframes hmm{0%,100%{transform:translateX(5px) scale(.75,.6)}50%{transform:translateX(-5px) scale(.75,.6)}}
.hl{transform-origin:0% 50%;animation:sweep 2.4s cubic-bezier(.6,0,.3,1) infinite;}
@keyframes sweep{0%{transform:scaleX(0);opacity:.9}50%{transform:scaleX(1);opacity:.9}80%{transform:scaleX(1);opacity:.9}100%{transform:scaleX(1);opacity:0}}
.dots circle{transform-origin:50% 50%;animation:dot 1.2s ease-in-out infinite;opacity:.25}
.d1{animation-delay:.2s!important}.d2{animation-delay:.4s!important}
@keyframes dot{0%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1.1)}}
</style><g transform="translate(-30,-12)"><ellipse class="a shadow" cx="250" cy="468" rx="92" ry="11" fill="#1F1A17" opacity="0.09"/><rect class="a hl" x="118" y="196" width="360" height="58" rx="29" fill="#F3D36B" opacity="0.9"/><g class="a body"><circle cx="289.75" cy="225.5" r="112" fill="#FCF8F1"/><path d="M178 426 V218 A112 112 0 1 1 237.39 324.52" fill="none" stroke="#3F6B4B" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/><g class="a face"><ellipse cx="246" cy="236" rx="13" ry="7.5" fill="#F1D3BF"/><ellipse cx="334" cy="236" rx="13" ry="7.5" fill="#F1D3BF"/><g class="a eyes"><ellipse class="a eye" cx="266" cy="206" rx="11" ry="14" fill="#1F1A17"/><ellipse class="a eye" cx="314" cy="206" rx="11" ry="14" fill="#1F1A17"/><circle cx="269.5" cy="201" r="3.6" fill="#FCF8F1"/><circle cx="317.5" cy="201" r="3.6" fill="#FCF8F1"/></g><circle class="a mouth" cx="290" cy="246" r="9.5" fill="#C0683F"/></g></g><g class="a dots" fill="#3F6B4B"><circle class="a d0" cx="414" cy="118" r="8"/><circle class="a d1" cx="440" cy="94" r="10"/><circle class="a d2" cx="470" cy="66" r="12"/></g></g></svg>