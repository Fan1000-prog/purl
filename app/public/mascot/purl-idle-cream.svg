<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Purl — idle"><title>Purl mascot — idle</title><style>
.a{transform-box:fill-box;}
.body{transform-origin:30% 100%;}
.eye{transform-origin:50% 50%;}
.shadow{transform-origin:50% 50%;}
.mouth{transform-origin:50% 50%;}

.body{animation:breathe 3s ease-in-out infinite;}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(.99,1.03)}}
.eye{animation:blink 3s ease-in-out infinite;}
@keyframes blink{0%,64%,76%,100%{transform:scaleY(1)}70%{transform:scaleY(.08)}}
.mouth{animation:hum 3s ease-in-out infinite;}
@keyframes hum{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.arc1{animation:arcfade 3s ease-in-out infinite;}
@keyframes arcfade{0%,100%{opacity:.18;transform:translateX(-4px)}50%{opacity:.85;transform:translateX(4px)}}
.shadow{animation:sh 3s ease-in-out infinite;}
@keyframes sh{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.97)}}
</style><rect width="512" height="512" fill="#F7F1E8"/><g transform="translate(-30,-12)"><ellipse class="a shadow" cx="250" cy="468" rx="92" ry="11" fill="#1F1A17" opacity="0.09"/><g class="a body"><circle cx="289.75" cy="225.5" r="112" fill="#FCF8F1"/><path d="M178 426 V218 A112 112 0 1 1 237.39 324.52" fill="none" stroke="#3F6B4B" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/><g class="a face"><ellipse cx="246" cy="236" rx="13" ry="7.5" fill="#F1D3BF"/><ellipse cx="334" cy="236" rx="13" ry="7.5" fill="#F1D3BF"/><g class="a eyes"><ellipse class="a eye" cx="266" cy="206" rx="11" ry="14" fill="#1F1A17"/><ellipse class="a eye" cx="314" cy="206" rx="11" ry="14" fill="#1F1A17"/><circle cx="269.5" cy="201" r="3.6" fill="#FCF8F1"/><circle cx="317.5" cy="201" r="3.6" fill="#FCF8F1"/></g><circle class="a mouth" cx="290" cy="246" r="9.5" fill="#C0683F"/></g></g><path class="a arc1" d="M438.1 165.6 A160 160 0 0 1 438.1 285.4" fill="none" stroke="#3F6B4B" stroke-width="16" stroke-linecap="round"/></g></svg>