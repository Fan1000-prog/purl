name: ci
on:
  pull_request: {}
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri
      # Windows: CPU-only ONNX Runtime from Microsoft, linked dynamically.
      - name: ONNX Runtime (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/onnxruntime-windows
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: app
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Unit tests and everything under tests/ (integration tests).
      - run: cargo test
